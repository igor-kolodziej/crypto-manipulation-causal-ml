[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-manipulation-causal-ml"
version = "0.1.0"
description = "Privacy-safe reference implementation for grouped prediction and causal ML in crypto-market manipulation research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
causal = ["econml>=0.15,<0.17", "xgboost>=2,<4"]
dev = ["pytest>=8,<9"]

[project.scripts]
crypto-manipulation = "crypto_manipulation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

